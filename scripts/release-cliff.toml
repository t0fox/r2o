[changelog]
body = """
{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first }} ({{ commit.id | truncate(length=7, end="") }}).
{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
# Диапазон задаёт workflow. Теги внутри него не делят описание на выпуски.
tag_pattern = "^$"
commit_parsers = [
  { message = '^(?:(?:ci|docs|style|test)(?:\(|!:|:)|[a-z]+\((?:release|changelog|ci|build)\)!?:)', skip = true },
]
