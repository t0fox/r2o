[workspace]
members = ["crates/r2o-telegram", "crates/r2k-core", "crates/r2o-datapath", "crates/r2o-controller", "crates/r2o-panel", "crates/r2o-manager"]
resolver = "3"

[patch.crates-io]
quinn = { path = "vendor/quinn" }
quinn-proto = { path = "vendor/quinn-proto" }
rustls = { path = "vendor/rustls" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
