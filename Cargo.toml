[workspace]
members = ["crates/r2o-telegram", "crates/r2k-core", "crates/r2o-datapath", "crates/r2o-controller", "crates/r2o-panel", "crates/r2o-manager"]
resolver = "3"

[patch.crates-io]
quinn = { path = "vendor/quinn" }
quinn-proto = { path = "vendor/quinn-proto" }
rustls = { path = "vendor/rustls" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Обработка пакетов и общие парсеры остаются оптимизированы на скорость.
[profile.release.package.r2o-datapath]
opt-level = 3

[profile.release.package.r2k-core]
opt-level = 3
