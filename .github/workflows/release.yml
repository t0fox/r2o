name: Подписанный выпуск R2O

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Ручные заметки выпуска. Если поле пустое, описание сформируется автоматически.
        type: string
        required: false
      validate_only:
        description: Проверить без публикации. На других ветках проверяются только заметки.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      release_id: ${{ steps.plan.outputs.release_id }}
      version: ${{ steps.plan.outputs.version }}
      title: ${{ steps.plan.outputs.title }}
      ci_run: ${{ steps.ci.outputs.run }}
      ci_attempt: ${{ steps.ci.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Выбрать успешный CI для этого коммита
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            > "$RUNNER_TEMP/ci-runs.json"
          selected=$(python3 scripts/ci-release-artifacts.py run "$RUNNER_TEMP/ci-runs.json" "$GITHUB_SHA" "$GITHUB_REPOSITORY")
          read -r run attempt <<< "$selected"
          printf 'run=%s\nattempt=%s\n' "$run" "$attempt" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          CI_RUN: ${{ steps.ci.outputs.run }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          test "$sha" = "$GITHUB_SHA"
          identity=$(python3 scripts/ci-release-artifacts.py identity "$sha" "$CI_RUN")
          id=$(sed -n 's/^release_id=//p' <<< "$identity")
          {
            echo "$identity"
            echo "sha=$sha"
            echo "version=$id"
          } >> "$GITHUB_OUTPUT"

  changelog:
    name: Заметки выпуска
    if: github.ref == 'refs/heads/main' || inputs.validate_only
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
      base_tag: ${{ steps.base.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Найти предыдущий опубликованный выпуск
        id: base
        if: inputs.notes == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          git check-ref-format "refs/tags/$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          key=$(python3 -B scripts/release-changelog.py cache-key)
          printf 'cache_key=%s\n' "$key" >> "$GITHUB_OUTPUT"
      - name: Восстановить кеш модели
        id: model-cache
        if: inputs.notes == ''
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: ${{ runner.temp }}/r2o-changelog/Qwen3-4B-Q4_K_M.gguf
          key: ${{ steps.base.outputs.cache_key }}
      - name: Подготовить описание выпуска
        id: notes
        env:
          MANUAL_NOTES: ${{ inputs.notes }}
          BASE_TAG: ${{ steps.base.outputs.tag }}
          MODEL_PATH: ${{ runner.temp }}/r2o-changelog/Qwen3-4B-Q4_K_M.gguf
        run: python3 -B scripts/release-changelog.py generate "$BASE_TAG" "$GITHUB_SHA" "$MODEL_PATH"
      - name: Сохранить проверенную модель в кеш
        if: steps.notes.outputs.model_verified == 'true' && steps.model-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/r2o-changelog/Qwen3-4B-Q4_K_M.gguf
          key: ${{ steps.base.outputs.cache_key }}

  package:
    name: Упаковка общего выпуска
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      inputs_id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_ID: ${{ needs.plan.outputs.release_id }}
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_SHA: ${{ needs.plan.outputs.sha }}
      RELEASE_TITLE: ${{ needs.plan.outputs.title }}
      R2O_R2_PUBLIC_URL: ${{ vars.R2O_R2_PUBLIC_URL }}
      NOTES: ${{ inputs.notes }}
      CI_RUN: ${{ needs.plan.outputs.ci_run }}
      CI_ATTEMPT: ${{ needs.plan.outputs.ci_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Проверить происхождение всех артефактов ABI
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN"
          gh api --paginate --slurp "$api/jobs?filter=all&per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api --paginate --slurp "$api/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          ids=$(python3 scripts/ci-release-artifacts.py select "$RUNNER_TEMP/jobs.json" "$RUNNER_TEMP/artifacts.json" \
            "$RELEASE_SHA" "$CI_RUN" "$CI_ATTEMPT" "$REPOSITORY_ID" "$RUNNER_TEMP/build-plan.json")
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.artifacts.outputs.ids }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.ci_run }}
          path: ${{ runner.temp }}/ci-artifacts
          digest-mismatch: error
      - name: Проверить SHA-256, ELF ABI и собрать общий манифест
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # CI мог быть перезапущен между выбором и скачиванием артефактов.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&per_page=100" \
            > "$RUNNER_TEMP/ci-runs.json"
          selected=$(python3 scripts/ci-release-artifacts.py run "$RUNNER_TEMP/ci-runs.json" "$RELEASE_SHA" "$GITHUB_REPOSITORY")
          test "$selected" = "$CI_RUN $CI_ATTEMPT"
          abis=$(python3 scripts/ci-release-artifacts.py prepare "$RUNNER_TEMP/ci-artifacts" "$RUNNER_TEMP/builds" \
            "$RUNNER_TEMP/build-plan.json" "$RELEASE_SHA" "$CI_RUN")
          export RELEASE_SEQUENCE=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          sh scripts/package-release.sh "$RUNNER_TEMP/builds" "$RUNNER_TEMP/release" "$abis"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: signed-release-inputs-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, package, changelog]
    if: ${{ !inputs.validate_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: r2o-signing
    permissions:
      actions: read
      contents: write
    concurrency:
      group: r2o-release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.plan.outputs.release_id }}
      VERSION: ${{ needs.plan.outputs.version }}
      TITLE: ${{ needs.plan.outputs.title }}
      SHA: ${{ needs.plan.outputs.sha }}
      R2O_R2_PUBLIC_URL: ${{ vars.R2O_R2_PUBLIC_URL }}
      NOTES: ${{ needs.changelog.outputs.notes }}
      CHANGELOG_BASE_TAG: ${{ needs.changelog.outputs.base_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.inputs_id }}
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Подписать и проверить метаданные выпуска
        env:
          PRIVATE_KEY: ${{ secrets.R2O_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::В окружении r2o-signing отсутствует R2O_ED25519_PRIVATE_KEY"
            exit 1
          fi
          key="$RUNNER_TEMP/signing.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$PRIVATE_KEY" > "$key")
          pinned=$(openssl pkey -pubin -in crates/r2o-manager/release-public.pem -outform DER | tail -c 32 | od -An -tx1 | tr -d '[:space:]')
          signer=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d '[:space:]')
          if [ -z "$pinned" ] || [ "$pinned" != "$signer" ]; then
            echo "::error::R2O_ED25519_PRIVATE_KEY не совпадает с ключом, встроенным в r2o-manager"
            exit 1
          fi
          out="$RUNNER_TEMP/release"
          old_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          if [ -n "$CHANGELOG_BASE_TAG" ] && [ "$CHANGELOG_BASE_TAG" != "$old_tag" ]; then
            echo "::error::После генерации заметок вышел новый релиз. Запустите выпуск заново."
            exit 1
          fi
          python3 -B scripts/release-changelog.py apply "$out/latest.json"
          openssl pkeyutl -sign -inkey "$key" -rawin \
            -in "$out/latest.json" -out "$out/latest.json.sig"
          openssl pkeyutl -verify -pubin -inkey crates/r2o-manager/release-public.pem \
            -rawin -in "$out/latest.json" -sigfile "$out/latest.json.sig"
          old_catalog="$RUNNER_TEMP/previous-catalog.json"
          published="$RUNNER_TEMP/published-update-tags.txt"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/releases-before.json"
          python3 -B scripts/release_retention.py before "$old_tag" \
            "$RUNNER_TEMP/releases-before.json" > "$published"
          case "$old_tag" in
            r2o-20261122-1125-6b5c711-45017277844-1)
              printf '{"format":1,"releases":[]}\n' > "$old_catalog"
              ;;
            *)
              gh release download "$old_tag" --pattern 'catalog.json*' --dir "$RUNNER_TEMP/catalog"
              mv "$RUNNER_TEMP/catalog/catalog.json" "$old_catalog"
              openssl pkeyutl -verify -pubin -inkey crates/r2o-manager/release-public.pem \
                -rawin -in "$old_catalog" -sigfile "$RUNNER_TEMP/catalog/catalog.json.sig"
              ;;
          esac
          python3 scripts/build-update-catalog.py "$old_tag" "$old_catalog" "$published" "$out"
          openssl pkeyutl -sign -inkey "$key" -rawin \
            -in "$out/catalog.json" -out "$out/catalog.json.sig"
      - name: Опубликовать подписанный выпуск
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2O_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2O_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2O_R2_ENDPOINT: ${{ vars.R2O_R2_ENDPOINT }}
          R2O_R2_BUCKET: ${{ vars.R2O_R2_BUCKET }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          notes="$RUNNER_TEMP/notes.txt"
          printf '%s\n' "$NOTES" > "$notes"
          # gh release create/edit шлёт устаревшие preview Accept-заголовки и
          # получает 403 от GitHub API. Создаём и публикуем выпуск напрямую.
          response=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$RELEASE_ID" -F draft=true -F prerelease=false \
            -f target_commitish="$SHA" -f name="$TITLE" -f body="$NOTES")
          release_id=$(printf '%s' "$response" | python3 -c \
            'import json,sys; print(json.load(sys.stdin)["id"])')
          for asset in "$out"/r2o-*.tar.gz "$out"/latest.json* "$out"/catalog.json*; do
            name=$(basename "$asset")
            curl -fsS --retry 3 -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$asset" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" \
              >/dev/null
          done
          verify="$RUNNER_TEMP/published-release"
          mkdir -p "$verify"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate \
            --jq '.[] | [.name,.url] | @tsv' |
            while IFS="$(printf '\t')" read -r name url; do
              curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/octet-stream" \
                -o "$verify/$name" "$url"
            done
          test -s "$verify/catalog.json"
          test -s "$verify/catalog.json.sig"
          sh scripts/verify-release-assets.sh "$verify" "$RELEASE_ID"
          if [ -n "$R2O_R2_PUBLIC_URL" ]; then
            : "${R2O_R2_ENDPOINT:?}" "${R2O_R2_BUCKET:?}" "${AWS_ACCESS_KEY_ID:?}" "${AWS_SECRET_ACCESS_KEY:?}"
            mirror="s3://$R2O_R2_BUCKET/$RELEASE_ID"
            for asset in "$verify"/r2o-*.tar.gz "$verify"/latest.json* "$verify"/catalog.json*; do
              name=$(basename "$asset")
              aws --endpoint-url "$R2O_R2_ENDPOINT" s3 cp --only-show-errors "$asset" "$mirror/$name"
              curl -fsSL --max-time 120 --retry 3 -o "$RUNNER_TEMP/r2-object" "${R2O_R2_PUBLIC_URL%/}/$RELEASE_ID/$name"
              cmp -s "$asset" "$RUNNER_TEMP/r2-object"
            done
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest=true >/dev/null
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$latest" = "$RELEASE_ID"
          if [ -n "$R2O_R2_PUBLIC_URL" ]; then
            printf '%s\n' "$RELEASE_ID" > "$RUNNER_TEMP/r2-latest"
            aws --endpoint-url "$R2O_R2_ENDPOINT" s3 cp --only-show-errors \
              --cache-control no-cache "$RUNNER_TEMP/r2-latest" "s3://$R2O_R2_BUCKET/latest"
          fi
      - name: Ротация опубликованных выпусков (последние 15)
        id: retention
        continue-on-error: true
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$latest" = "$RELEASE_ID"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/releases-after.json"
          # The downloaded catalog was signature-verified before publication.
          # Refuse deletion if any of its releases would be removed.
          python3 -B scripts/release_retention.py after "$RELEASE_ID" \
            "$RUNNER_TEMP/releases-after.json" "$RUNNER_TEMP/published-release/catalog.json" \
            > "$RUNNER_TEMP/prune-releases.tsv"
          while IFS=$'\t' read -r id tag; do
            test -n "$id" && test -n "$tag" || continue
            echo "Pruning release $tag ($id)"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            sleep 1
            if ! gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"; then
              echo "::warning::Не удалось удалить тег старого выпуска $tag"
            fi
            sleep 1
          done < "$RUNNER_TEMP/prune-releases.tsv"
      - name: Сообщить о сбое ротации
        if: ${{ steps.retention.outcome == 'failure' }}
        run: echo "::warning::Релиз опубликован, но ротация не завершена; следующая публикация повторит очистку"
