name: Подписанный выпуск R2O

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Заметки выпуска, которые увидит пользователь панели
        type: string
        required: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      release_id: ${{ steps.plan.outputs.release_id }}
      version: ${{ steps.plan.outputs.version }}
      title: ${{ steps.plan.outputs.title }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Проверить успешный CI для этого коммита
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .status == "completed" and .conclusion == "success" and .head_branch == "main")] | length')
          if [ "$runs" -eq 0 ]; then
            echo "::error::Для этого коммита main нет успешного запуска CI"
            exit 1
          fi
      - id: plan
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse "$GITHUB_SHA")
          short=$(git rev-parse --short=7 "$sha")
          title="R2O $(TZ=Europe/Simferopol date +%d.%m.%Y) ($short)"
          id="r2o-$(date -u +%Y%m%d-%H%M)-$short-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "sha=$sha"
            echo "release_id=$id"
            echo "version=$id"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"
          delimiter="notes-$(openssl rand -hex 12)"
          {
            echo "notes<<$delimiter"
            printf '%s\n' "$NOTES"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Сборка ABI — ${{ matrix.abi }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - abi: mipsel
            target: mipsel-unknown-linux-gnu
            asset_suffix: mipsel
            script: scripts/build-mipsel.sh
            packages: gcc-mipsel-linux-gnu binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
          - abi: mipsel-openwrt-musl
            target: mipsel-unknown-linux-musl
            asset_suffix: mipsel-openwrt-musl
            script: scripts/r2o-build-openwrt-mipsel-musl.sh
            packages: zstd binutils curl
            sdk_archive: openwrt-mipsel-musl-toolchain-25.12.5.tar.zst
            sdk_sha256: 5a02d679c1ff052745b419b564624380dd3e5f6218db64c65b8ec9df56e2c263
          - abi: aarch64-openwrt-musl
            target: aarch64-unknown-linux-musl
            asset_suffix: aarch64-openwrt-musl
            script: scripts/r2o-build-openwrt-aarch64-musl.sh
            packages: zstd binutils curl
            sdk_archive: openwrt-aarch64-musl-toolchain-25.12.5.tar.zst
            sdk_sha256: 37875a8a69b46c9dc2a8c8bfd34a14f5de03fbea775f7cf8569f7e709c93403b
          - abi: armv5-musleabi
            target: armv5te-unknown-linux-musleabi
            asset_suffix: armv5-musleabi
            script: scripts/r2o-build-armv5-musleabi.sh
            packages: clang-18 binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
          - abi: armv7-openwrt-musl
            target: armv7-unknown-linux-musleabihf
            asset_suffix: armv7-openwrt-musl
            script: scripts/r2o-build-openwrt-armv7-musl.sh
            packages: zstd binutils curl
            sdk_archive: openwrt-armv7-musl-toolchain-25.12.5.tar.zst
            sdk_sha256: 2284afb56cbeef040372b02b721f1657ce1eee8e1c024fb1a0188374b472ae51
          - abi: armv7-musleabi
            target: armv7-unknown-linux-musleabi
            script: scripts/r2o-build-static-musl.sh
            packages: binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
            asset_suffix: armv7-musleabi
          - abi: mips-openwrt-musl
            target: mips-unknown-linux-musl
            script: scripts/r2o-build-static-musl.sh
            packages: binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
            asset_suffix: mips-openwrt-musl
          - abi: mips64el-musl
            target: mips64el-unknown-linux-muslabi64
            script: scripts/r2o-build-static-musl.sh
            packages: binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
            asset_suffix: mips64el-musl
          - abi: x86_64-musl
            target: x86_64-unknown-linux-musl
            script: scripts/r2o-build-static-musl.sh
            packages: binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
            asset_suffix: x86_64-musl
          - abi: i686-musl
            target: i686-unknown-linux-musl
            script: scripts/r2o-build-static-musl.sh
            packages: binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
            asset_suffix: i686-musl
          - abi: powerpc64-musl
            target: powerpc64-unknown-linux-musl
            script: scripts/r2o-build-static-musl.sh
            packages: binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
            asset_suffix: powerpc64-musl
          - abi: riscv64-musl
            target: riscv64gc-unknown-linux-musl
            script: scripts/r2o-build-static-musl.sh
            packages: binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
            asset_suffix: riscv64-musl
    env:
      CARGO_BUILD_WARNINGS: deny
      R2O_RELEASE_ID: ${{ needs.plan.outputs.release_id }}
      R2O_RELEASE_TITLE: ${{ needs.plan.outputs.title }}
      R2O_COMMIT: ${{ needs.plan.outputs.sha }}
      ABI: ${{ matrix.abi }}
      TARGET: ${{ matrix.target }}
      ASSET_SUFFIX: ${{ matrix.asset_suffix }}
      BUILD_SCRIPT: ${{ matrix.script }}
      PACKAGES: ${{ matrix.packages }}
      R2O_ARMV5_LINKER: ${{ github.workspace }}/scripts/ci-armv5-clang-cc.sh
      R2O_ARMV5_AR: ar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ matrix.sdk_sha256 != '' }}
        with:
          path: ~/.cache/r2o/openwrt/${{ matrix.sdk_archive }}
          key: r2o-openwrt-sdk-${{ runner.os }}-${{ matrix.abi }}-${{ matrix.sdk_sha256 }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ matrix.abi == 'mipsel' }}
        with:
          path: ${{ runner.temp }}/r2o-apt-archives
          key: r2o-apt-ubuntu-24.04-${{ matrix.abi }}-cross-v1
      - name: Установить инструменты ABI
        run: |
          set -euo pipefail
          read -r -a packages <<< "$PACKAGES"
          sh scripts/ci-apt-cache.sh prepare "$RUNNER_TEMP/r2o-apt-archives" /tmp/r2o-apt-archives-partial
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            -o Dir::Cache::archives="$RUNNER_TEMP/r2o-apt-archives" \
            -o Dir::Cache::archives::partial=/tmp/r2o-apt-archives-partial \
            "${packages[@]}"
          sh scripts/ci-apt-cache.sh finalize "$RUNNER_TEMP/r2o-apt-archives"
      - uses: ./.github/actions/setup-zig
        if: matrix.script == 'scripts/r2o-build-static-musl.sh'
        with:
          version: ${{ matrix.abi == 'mips64el-musl' && '0.14.1' || '0.16.0' }}
          sha256: ${{ matrix.abi == 'mips64el-musl' && '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c' || '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00' }}
      - name: Установить QEMU
        run: |
          sh scripts/ci-install-release-qemu.sh "$RUNNER_TEMP/qemu"
          echo "$RUNNER_TEMP/qemu/bin" >> "$GITHUB_PATH"
      - name: Зафиксировать время сборки
        run: echo "R2O_BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Собрать ABI и проверить ELF-артефакты
        run: |
          sh "$BUILD_SCRIPT"
          sh scripts/check-release-abi.sh "$ABI" "target/$TARGET/release"
          (cd "target/$TARGET/release" && sha256sum r2o-datapath r2o-controller r2o-panel r2o-telegram r2o-manager r2o-fetch r2o-detect > SHA256SUMS)
      - name: Подготовить бинарники ABI для общей упаковки
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/builds/$ABI"
          mkdir -p "$stage"
          for component in r2o-datapath r2o-controller r2o-panel r2o-telegram r2o-manager r2o-fetch r2o-detect; do
            install -m 0755 "target/$TARGET/release/$component" "$stage/$component-linux-$ASSET_SUFFIX"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-build-${{ matrix.abi }}
          path: ${{ runner.temp }}/builds
          if-no-files-found: error
          retention-days: 1

  package:
    name: Упаковка общего выпуска
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_ID: ${{ needs.plan.outputs.release_id }}
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_SHA: ${{ needs.plan.outputs.sha }}
      RELEASE_TITLE: ${{ needs.plan.outputs.title }}
      R2O_R2_PUBLIC_URL: ${{ vars.R2O_R2_PUBLIC_URL }}
      NOTES: ${{ needs.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signed-release-build-*
          path: ${{ runner.temp }}/builds
          merge-multiple: true
      - name: Упаковать ABI и общий манифест
        run: |
          set -euo pipefail
          export RELEASE_SEQUENCE=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          sh scripts/package-release.sh "$RUNNER_TEMP/builds" "$RUNNER_TEMP/release" \
            'mipsel mipsel-openwrt-musl aarch64-openwrt-musl armv5-musleabi armv7-openwrt-musl armv7-musleabi mips-openwrt-musl mips64el-musl x86_64-musl i686-musl powerpc64-musl riscv64-musl'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-inputs
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: r2o-signing
    permissions:
      actions: read
      contents: write
    concurrency:
      group: r2o-release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.plan.outputs.release_id }}
      VERSION: ${{ needs.plan.outputs.version }}
      TITLE: ${{ needs.plan.outputs.title }}
      SHA: ${{ needs.plan.outputs.sha }}
      R2O_R2_PUBLIC_URL: ${{ vars.R2O_R2_PUBLIC_URL }}
      NOTES: ${{ needs.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-inputs
          path: ${{ runner.temp }}/release
      - name: Подписать и проверить метаданные выпуска
        env:
          PRIVATE_KEY: ${{ secrets.R2O_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::В окружении r2o-signing отсутствует R2O_ED25519_PRIVATE_KEY"
            exit 1
          fi
          key="$RUNNER_TEMP/signing.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$PRIVATE_KEY" > "$key")
          pinned=$(openssl pkey -pubin -in crates/r2o-manager/release-public.pem -outform DER | tail -c 32 | od -An -tx1 | tr -d '[:space:]')
          signer=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d '[:space:]')
          if [ -z "$pinned" ] || [ "$pinned" != "$signer" ]; then
            echo "::error::R2O_ED25519_PRIVATE_KEY не совпадает с ключом, встроенным в r2o-manager"
            exit 1
          fi
          out="$RUNNER_TEMP/release"
          openssl pkeyutl -sign -inkey "$key" -rawin \
            -in "$out/latest.json" -out "$out/latest.json.sig"
          openssl pkeyutl -verify -pubin -inkey crates/r2o-manager/release-public.pem \
            -rawin -in "$out/latest.json" -sigfile "$out/latest.json.sig"
          old_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          old_catalog="$RUNNER_TEMP/previous-catalog.json"
          published="$RUNNER_TEMP/published-update-tags.txt"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false) |
              select(any(.assets[]; .name == "latest.json.sig")) | .tag_name' > "$published"
          case "$old_tag" in
            r2o-20261122-1125-6b5c711-45017277844-1)
              printf '{"format":1,"releases":[]}\n' > "$old_catalog"
              ;;
            *)
              gh release download "$old_tag" --pattern 'catalog.json*' --dir "$RUNNER_TEMP/catalog"
              mv "$RUNNER_TEMP/catalog/catalog.json" "$old_catalog"
              openssl pkeyutl -verify -pubin -inkey crates/r2o-manager/release-public.pem \
                -rawin -in "$old_catalog" -sigfile "$RUNNER_TEMP/catalog/catalog.json.sig"
              ;;
          esac
          python3 scripts/build-update-catalog.py "$old_tag" "$old_catalog" "$published" "$out"
          openssl pkeyutl -sign -inkey "$key" -rawin \
            -in "$out/catalog.json" -out "$out/catalog.json.sig"
      - name: Опубликовать подписанный выпуск
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2O_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2O_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2O_R2_ENDPOINT: ${{ vars.R2O_R2_ENDPOINT }}
          R2O_R2_BUCKET: ${{ vars.R2O_R2_BUCKET }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          notes="$RUNNER_TEMP/notes.txt"
          printf '%s\n' "$NOTES" > "$notes"
          # gh release create/edit шлёт устаревшие preview Accept-заголовки и
          # получает 403 от GitHub API. Создаём и публикуем выпуск напрямую.
          response=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$RELEASE_ID" -F draft=true -F prerelease=false \
            -f target_commitish="$SHA" -f name="$TITLE" -f body="$NOTES")
          release_id=$(printf '%s' "$response" | python3 -c \
            'import json,sys; print(json.load(sys.stdin)["id"])')
          for asset in "$out"/r2o-*.tar.gz "$out"/latest.json* "$out"/catalog.json*; do
            name=$(basename "$asset")
            curl -fsS --retry 3 -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$asset" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" \
              >/dev/null
          done
          verify="$RUNNER_TEMP/published-release"
          mkdir -p "$verify"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate \
            --jq '.[] | [.name,.url] | @tsv' |
            while IFS="$(printf '\t')" read -r name url; do
              curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/octet-stream" \
                -o "$verify/$name" "$url"
            done
          test -s "$verify/catalog.json"
          test -s "$verify/catalog.json.sig"
          sh scripts/verify-release-assets.sh "$verify" "$RELEASE_ID"
          if [ -n "$R2O_R2_PUBLIC_URL" ]; then
            : "${R2O_R2_ENDPOINT:?}" "${R2O_R2_BUCKET:?}" "${AWS_ACCESS_KEY_ID:?}" "${AWS_SECRET_ACCESS_KEY:?}"
            mirror="s3://$R2O_R2_BUCKET/$RELEASE_ID"
            for asset in "$verify"/r2o-*.tar.gz "$verify"/latest.json* "$verify"/catalog.json*; do
              name=$(basename "$asset")
              aws --endpoint-url "$R2O_R2_ENDPOINT" s3 cp --only-show-errors "$asset" "$mirror/$name"
              curl -fsSL --max-time 120 --retry 3 -o "$RUNNER_TEMP/r2-object" "${R2O_R2_PUBLIC_URL%/}/$RELEASE_ID/$name"
              cmp -s "$asset" "$RUNNER_TEMP/r2-object"
            done
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest=true >/dev/null
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$latest" = "$RELEASE_ID"
          if [ -n "$R2O_R2_PUBLIC_URL" ]; then
            printf '%s\n' "$RELEASE_ID" > "$RUNNER_TEMP/r2-latest"
            aws --endpoint-url "$R2O_R2_ENDPOINT" s3 cp --only-show-errors \
              --cache-control no-cache "$RUNNER_TEMP/r2-latest" "s3://$R2O_R2_BUCKET/latest"
          fi
