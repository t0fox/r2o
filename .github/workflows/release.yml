name: Подписанный выпуск R2O

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Заметки выпуска, которые увидит пользователь панели
        type: string
        required: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      release_id: ${{ steps.plan.outputs.release_id }}
      version: ${{ steps.plan.outputs.version }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Проверить успешный CI для этого коммита
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .status == "completed" and .conclusion == "success" and .head_branch == "main")] | length')
          if [ "$runs" -eq 0 ]; then
            echo "::error::Для этого коммита main нет успешного запуска CI"
            exit 1
          fi
      - id: plan
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse "$GITHUB_SHA")
          short=$(git rev-parse --short=7 "$sha")
          id="r2o-$(date -u +%Y%m%d-%H%M)-$short-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "sha=$sha"
            echo "release_id=$id"
            echo "version=$id"
          } >> "$GITHUB_OUTPUT"
          delimiter="notes-$(openssl rand -hex 12)"
          {
            echo "notes<<$delimiter"
            printf '%s\n' "$NOTES"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Установить инструменты сборки MIPS и ARMv5
        run: sudo apt-get update && sudo apt-get install -y gcc-mipsel-linux-gnu gcc-arm-linux-gnueabi qemu-user zstd binutils curl
      - name: Собрать и проверить выпуск GNU MIPS
        run: sh scripts/build-mipsel.sh
      - name: Собрать и проверить ARMv5 musleabi под QEMU
        run: sh scripts/r2o-build-armv5-musleabi.sh
      - name: Собрать и проверить выпуск OpenWrt musl
        run: sh scripts/r2o-build-openwrt-mipsel-musl.sh
      - name: Собрать и проверить выпуск OpenWrt ARM64 musl
        run: sh scripts/r2o-build-openwrt-aarch64-musl.sh
      - name: Упаковать ABI и общий манифест
        env:
          RELEASE_ID: ${{ needs.plan.outputs.release_id }}
          VERSION: ${{ needs.plan.outputs.version }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          set -euo pipefail
          builds="$RUNNER_TEMP/builds"
          out="$RUNNER_TEMP/release"
          mkdir -p "$builds/mipsel" "$builds/mipsel-openwrt-musl" "$builds/aarch64-openwrt-musl" "$builds/armv5-musleabi"
          for component in r2o-datapath r2o-controller r2o-panel r2o-telegram r2o-manager r2o-fetch; do
            install -m 0755 "target/mipsel-unknown-linux-gnu/release/$component" \
              "$builds/mipsel/$component-linux-mipsel"
            install -m 0755 "target/mipsel-unknown-linux-musl/release/$component" \
              "$builds/mipsel-openwrt-musl/$component-linux-mipsel-openwrt-musl"
            install -m 0755 "target/aarch64-unknown-linux-musl/release/$component" \
              "$builds/aarch64-openwrt-musl/$component-linux-aarch64-openwrt-musl"
            install -m 0755 "target/armv5te-unknown-linux-musleabi/release/$component" \
              "$builds/armv5-musleabi/$component-linux-armv5-musleabi"
          done
          sh scripts/package-release.sh "$builds" "$out" 'mipsel mipsel-openwrt-musl aarch64-openwrt-musl armv5-musleabi'
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-inputs
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: r2o-signing
    permissions:
      actions: read
      contents: write
    concurrency:
      group: r2o-release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.plan.outputs.release_id }}
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      NOTES: ${{ needs.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-inputs
          path: ${{ runner.temp }}/release
      - name: Подписать и проверить метаданные выпуска
        env:
          PRIVATE_KEY: ${{ secrets.R2O_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::В окружении r2o-signing отсутствует R2O_ED25519_PRIVATE_KEY"
            exit 1
          fi
          key="$RUNNER_TEMP/signing.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$PRIVATE_KEY" > "$key")
          pinned=$(openssl pkey -pubin -in crates/r2o-manager/release-public.pem -outform DER | tail -c 32 | od -An -tx1 | tr -d '[:space:]')
          signer=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d '[:space:]')
          if [ -z "$pinned" ] || [ "$pinned" != "$signer" ]; then
            echo "::error::R2O_ED25519_PRIVATE_KEY не совпадает с ключом, встроенным в r2o-manager"
            exit 1
          fi
          out="$RUNNER_TEMP/release"
          openssl pkeyutl -sign -inkey "$key" -rawin \
            -in "$out/latest.json" -out "$out/latest.json.sig"
          openssl pkeyutl -verify -pubin -inkey crates/r2o-manager/release-public.pem \
            -rawin -in "$out/latest.json" -sigfile "$out/latest.json.sig"
      - name: Опубликовать подписанный выпуск
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          notes="$RUNNER_TEMP/notes.txt"
          printf '%s\n' "$NOTES" > "$notes"
          gh release create "$RELEASE_ID" --draft --target "$SHA" \
            --title "r2o $VERSION" --notes-file "$notes" \
            "$out/r2o-mipsel.tar.gz" "$out/r2o-mipsel-openwrt-musl.tar.gz" \
            "$out/r2o-aarch64-openwrt-musl.tar.gz" \
            "$out/r2o-armv5-musleabi.tar.gz" \
            "$out/latest.json" "$out/latest.json.sig"
          gh release edit "$RELEASE_ID" --draft=false --latest
