name: Подписанный выпуск R2O

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Заметки выпуска, которые увидит пользователь панели
        type: string
        required: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      release_id: ${{ steps.plan.outputs.release_id }}
      version: ${{ steps.plan.outputs.version }}
      title: ${{ steps.plan.outputs.title }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Проверить успешный CI для этого коммита
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .status == "completed" and .conclusion == "success" and .head_branch == "main")] | length')
          if [ "$runs" -eq 0 ]; then
            echo "::error::Для этого коммита main нет успешного запуска CI"
            exit 1
          fi
      - id: plan
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse "$GITHUB_SHA")
          short=$(git rev-parse --short=7 "$sha")
          title="R2O $(date -u +%d.%m.%Y) ($short)"
          id="r2o-$(date -u +%Y%m%d-%H%M)-$short-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "sha=$sha"
            echo "release_id=$id"
            echo "version=$id"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"
          delimiter="notes-$(openssl rand -hex 12)"
          {
            echo "notes<<$delimiter"
            printf '%s\n' "$NOTES"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Сборка ABI — ${{ matrix.abi }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - abi: mipsel
            target: mipsel-unknown-linux-gnu
            asset_suffix: mipsel
            script: scripts/build-mipsel.sh
            packages: gcc-mipsel-linux-gnu qemu-user binutils
            sdk_archive: ''
            sdk_sha256: ''
          - abi: mipsel-openwrt-musl
            target: mipsel-unknown-linux-musl
            asset_suffix: mipsel-openwrt-musl
            script: scripts/r2o-build-openwrt-mipsel-musl.sh
            packages: qemu-user zstd binutils curl
            sdk_archive: openwrt-mipsel-musl-toolchain-25.12.5.tar.zst
            sdk_sha256: 5a02d679c1ff052745b419b564624380dd3e5f6218db64c65b8ec9df56e2c263
          - abi: aarch64-openwrt-musl
            target: aarch64-unknown-linux-musl
            asset_suffix: aarch64-openwrt-musl
            script: scripts/r2o-build-openwrt-aarch64-musl.sh
            packages: qemu-user zstd binutils curl
            sdk_archive: openwrt-aarch64-musl-toolchain-25.12.5.tar.zst
            sdk_sha256: 37875a8a69b46c9dc2a8c8bfd34a14f5de03fbea775f7cf8569f7e709c93403b
          - abi: armv5-musleabi
            target: armv5te-unknown-linux-musleabi
            asset_suffix: armv5-musleabi
            script: scripts/r2o-build-armv5-musleabi.sh
            packages: clang-18 qemu-user binutils
            sdk_archive: ''
            sdk_sha256: ''
          - abi: armv7-openwrt-musl
            target: armv7-unknown-linux-musleabihf
            asset_suffix: armv7-openwrt-musl
            script: scripts/r2o-build-openwrt-armv7-musl.sh
            packages: qemu-user zstd binutils curl
            sdk_archive: openwrt-armv7-musl-toolchain-25.12.5.tar.zst
            sdk_sha256: 2284afb56cbeef040372b02b721f1657ce1eee8e1c024fb1a0188374b472ae51
    env:
      ABI: ${{ matrix.abi }}
      TARGET: ${{ matrix.target }}
      ASSET_SUFFIX: ${{ matrix.asset_suffix }}
      BUILD_SCRIPT: ${{ matrix.script }}
      PACKAGES: ${{ matrix.packages }}
      R2O_ARMV5_LINKER: ${{ github.workspace }}/scripts/ci-armv5-clang-cc.sh
      R2O_ARMV5_AR: ar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ matrix.sdk_sha256 != '' }}
        with:
          path: ~/.cache/r2o/openwrt/${{ matrix.sdk_archive }}
          key: r2o-openwrt-sdk-${{ runner.os }}-${{ matrix.abi }}-${{ matrix.sdk_sha256 }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ matrix.abi == 'mipsel' }}
        with:
          path: ${{ runner.temp }}/r2o-apt-archives
          key: r2o-apt-ubuntu-24.04-${{ matrix.abi }}-cross-v1
      - name: Установить инструменты ABI
        run: |
          set -euo pipefail
          read -r -a packages <<< "$PACKAGES"
          sh scripts/ci-apt-cache.sh prepare "$RUNNER_TEMP/r2o-apt-archives" /tmp/r2o-apt-archives-partial
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            -o Dir::Cache::archives="$RUNNER_TEMP/r2o-apt-archives" \
            -o Dir::Cache::archives::partial=/tmp/r2o-apt-archives-partial \
            "${packages[@]}"
          sh scripts/ci-apt-cache.sh finalize "$RUNNER_TEMP/r2o-apt-archives"
      - name: Собрать ABI и проверить программы под QEMU
        run: sh "$BUILD_SCRIPT"
      - name: Подготовить бинарники ABI для общей упаковки
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/builds/$ABI"
          mkdir -p "$stage"
          for component in r2o-datapath r2o-controller r2o-panel r2o-telegram r2o-manager r2o-fetch; do
            install -m 0755 "target/$TARGET/release/$component" "$stage/$component-linux-$ASSET_SUFFIX"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-build-${{ matrix.abi }}
          path: ${{ runner.temp }}/builds
          if-no-files-found: error
          retention-days: 1

  package:
    name: Упаковка общего выпуска
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_ID: ${{ needs.plan.outputs.release_id }}
      VERSION: ${{ needs.plan.outputs.version }}
      NOTES: ${{ needs.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signed-release-build-*
          path: ${{ runner.temp }}/builds
          merge-multiple: true
      - name: Упаковать ABI и общий манифест
        run: |
          set -euo pipefail
          sh scripts/package-release.sh "$RUNNER_TEMP/builds" "$RUNNER_TEMP/release" \
            'mipsel mipsel-openwrt-musl aarch64-openwrt-musl armv5-musleabi armv7-openwrt-musl'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-inputs
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: r2o-signing
    permissions:
      actions: read
      contents: write
    concurrency:
      group: r2o-release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.plan.outputs.release_id }}
      VERSION: ${{ needs.plan.outputs.version }}
      TITLE: ${{ needs.plan.outputs.title }}
      SHA: ${{ needs.plan.outputs.sha }}
      NOTES: ${{ needs.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-inputs
          path: ${{ runner.temp }}/release
      - name: Подписать и проверить метаданные выпуска
        env:
          PRIVATE_KEY: ${{ secrets.R2O_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::В окружении r2o-signing отсутствует R2O_ED25519_PRIVATE_KEY"
            exit 1
          fi
          key="$RUNNER_TEMP/signing.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$PRIVATE_KEY" > "$key")
          pinned=$(openssl pkey -pubin -in crates/r2o-manager/release-public.pem -outform DER | tail -c 32 | od -An -tx1 | tr -d '[:space:]')
          signer=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d '[:space:]')
          if [ -z "$pinned" ] || [ "$pinned" != "$signer" ]; then
            echo "::error::R2O_ED25519_PRIVATE_KEY не совпадает с ключом, встроенным в r2o-manager"
            exit 1
          fi
          out="$RUNNER_TEMP/release"
          openssl pkeyutl -sign -inkey "$key" -rawin \
            -in "$out/latest.json" -out "$out/latest.json.sig"
          openssl pkeyutl -verify -pubin -inkey crates/r2o-manager/release-public.pem \
            -rawin -in "$out/latest.json" -sigfile "$out/latest.json.sig"
      - name: Опубликовать подписанный выпуск
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          notes="$RUNNER_TEMP/notes.txt"
          printf '%s\n' "$NOTES" > "$notes"
          gh release create "$RELEASE_ID" --draft --target "$SHA" \
            --title "$TITLE" --notes-file "$notes" \
            "$out/r2o-mipsel.tar.gz" "$out/r2o-mipsel-openwrt-musl.tar.gz" \
            "$out/r2o-aarch64-openwrt-musl.tar.gz" \
            "$out/r2o-armv5-musleabi.tar.gz" \
            "$out/r2o-armv7-openwrt-musl.tar.gz" \
            "$out/latest.json" "$out/latest.json.sig"
          gh release edit "$RELEASE_ID" --draft=false --latest
