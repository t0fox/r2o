name: Диагностика выпуска

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-24.04
    environment: r2o-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Полный цикл выпуска через API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="r2o-diag-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          response=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" -F draft=true -F prerelease=false \
            -f target_commitish="$GITHUB_SHA" -f name="$tag" -f body="diagnostic")
          id=$(printf '%s' "$response" | jq -r .id)
          printf 'asset\n' > "$RUNNER_TEMP/asset.txt"
          curl -fsS --retry 3 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$RUNNER_TEMP/asset.txt" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=asset.txt" \
            >/dev/null
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false >/dev/null
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
          echo "FULL_CYCLE_OK"
