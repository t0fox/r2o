name: Диагностика выпуска

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-24.04
    environment: r2o-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Показать права токена
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api rate_limit --jq '.rate'
      - name: Создать черновик через API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: api
        run: |
          set -euo pipefail
          tag="r2o-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          response=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" -F draft=true -f target_commitish="$GITHUB_SHA" \
            -f name="$tag" -f body="diagnostic")
          printf '%s\n' "$response"
          id=$(printf '%s' "$response" | jq -r .id)
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          echo "CREATE_OK"
