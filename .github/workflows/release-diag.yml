name: Диагностика выпуска

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-24.04
    environment: r2o-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Показать права токена
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api rate_limit --jq '.rate'
      - name: Создать черновик через gh release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: api
        run: |
          set -euo pipefail
          tag="r2o-diag-gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --draft \
            --target d1b33ed1fa2d5fec3599ed0a4a193fc6ad3609f5 \
            --title "$tag" --notes "diagnostic"
          gh release delete "$tag" --yes --cleanup-tag
          echo "GH_RELEASE_CREATE_OK"
