name: R2O installer URL

on:
  push:
    branches: [main]
    paths:
      - docs/installer/**
      - crates/r2o-panel/assets/favicon.svg
      - crates/r2o-panel/assets/fonts/unbounded-latin.woff2
      - crates/r2o-panel/assets/fonts/OFL-unbounded.txt
      - scripts/bootstrap-pins.py
      - scripts/bootstrap.sh
      - scripts/install.sh
      - .github/workflows/installer-pages.yml
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Подготовить короткий адрес установки
        run: |
          mkdir site
          cp -a docs/installer/. site/
          cp crates/r2o-panel/assets/favicon.svg site/mark.svg
          cp crates/r2o-panel/assets/fonts/unbounded-latin.woff2 site/unbounded.woff2
          cp crates/r2o-panel/assets/fonts/OFL-unbounded.txt site/OFL-unbounded.txt
          python3 -B scripts/bootstrap-pins.py --pages "$GITHUB_SHA" site/get
          sh -n site/get
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # версия v5.0.0
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: site
      - name: Дождаться регистрации артефакта Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          : "${ARTIFACT_ID:?Загрузка не вернула ID артефакта Pages}"
          for attempt in {1..10}; do
            if gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                -f name="$PAGES_ARTIFACT_NAME" --jq '.artifacts[] | select(.expired == false).id' |
                grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 10 ]; then sleep 3; fi
          done
          echo "::error::Артефакт Pages $ARTIFACT_ID не появился после загрузки"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # версия v5.0.1
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
