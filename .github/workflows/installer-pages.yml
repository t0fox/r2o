name: R2O installer URL

on:
  push:
    branches: [main]
    paths:
      - docs/installer/**
      - crates/r2o-panel/assets/favicon.svg
      - crates/r2o-panel/assets/fonts/unbounded-latin.woff2
      - crates/r2o-panel/assets/fonts/OFL-unbounded.txt
      - scripts/bootstrap-pins.py
      - scripts/bootstrap.sh
      - scripts/install.sh
      - .github/workflows/installer-pages.yml
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Подготовить короткий адрес установки
        run: |
          mkdir site
          cp -a docs/installer/. site/
          cp crates/r2o-panel/assets/favicon.svg site/mark.svg
          cp crates/r2o-panel/assets/fonts/unbounded-latin.woff2 site/unbounded.woff2
          cp crates/r2o-panel/assets/fonts/OFL-unbounded.txt site/OFL-unbounded.txt
          python3 -B scripts/bootstrap-pins.py --pages "$GITHUB_SHA" site/get
          sh -n site/get
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
