name: Проверки R2O

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ZIG_VERSION: '0.16.0'
  ZIG_SHA256: '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00'

jobs:
  lint:
    name: Быстрые проверки — ShellCheck и формат Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - name: Установить ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Проверить shell-скрипты проекта
        run: |
          find scripts router -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -s sh
          shellcheck -s sh router/S99r2o router/S99r2o.shim router/openwrt-init
      - name: Проверить форматирование Rust
        run: cargo fmt --all --check

  panel:
    name: Панель — HTTP, CLI и безопасность
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - name: Проверить панель и её HTTP-обработчики
        run: cargo test --locked --package r2o-panel

  telegram:
    name: Telegram — тесты клиента
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - name: Запустить тесты Telegram-клиента
        run: cargo test --locked --package r2o-telegram

  panel-browser:
    name: Chrome — раскладка и работа панели
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2O_CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # версия v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # версия v2
        id: chrome
        with:
          chrome-version: stable
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - name: Собрать панель
        run: cargo build --locked --package r2o-panel
      - name: Проверить представление Telegram в статистике панели
        run: node crates/r2o-panel/tests/telegram_flow.cjs
      - name: Проверить Chrome, раскладку, навигацию и шрифты
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          R2O_CAPTURE_DIR: ${{ runner.temp }}/panel-browser
        run: |
          mkdir -p "$R2O_CAPTURE_DIR"
          node crates/r2o-panel/tests/browser.cjs
      - name: Сохранить снимки панели и журнал браузера
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # версия v7.0.2
        with:
          name: r2o-panel-chrome
          path: ${{ runner.temp }}/panel-browser
          retention-days: 7
          if-no-files-found: warn

  shell:
    name: Сценарии и проверки установки
    needs: lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - name: Собрать бинарники для сценариев роутера
        run: cargo build --locked --release --package r2o-manager --bin r2o-manager --package r2o-controller --bin r2o-controller --package r2o-telegram --bin r2o-telegram
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # версия v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Проверить упаковку выпуска
        run: sh scripts/test-package-release.sh
      - name: Проверить сценарии обновления и службы роутера
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/test-router-*.sh)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::Не найдены сценарии проверки роутерных служб"
            exit 1
          fi
          failed=()
          for test in "${tests[@]}"; do
            echo "::group::$test"
            if [ "$test" = scripts/test-router-firewall.sh ]; then
              if sudo sh "$test"; then
                :
              else
                status=$?
                failed+=("$test ($status)")
              fi
            elif sh "$test"; then
              :
            else
              status=$?
              failed+=("$test ($status)")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '::error::Ошибки сценариев роутера: %s\n' "${failed[*]}"
            exit 1
          fi

  datapath:
    name: Датапат — тесты и переносимость
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - name: Проверить сетевой исполнитель и сопутствующие пакеты
        run: cargo test --locked --package r2o-datapath

  core:
    name: Ядро — тесты управляющего протокола
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - name: Проверить ядро и его оракул
        run: cargo test --locked --package r2k-core

  sanitizers:
    name: Датапат, ядро и панель под AddressSanitizer
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
        with:
          toolchain: nightly-2026-10-17
          components: rust-src
      - name: Запустить тесты с AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: >-
          cargo +nightly-2026-10-17 test -Zbuild-std --locked
          --target x86_64-unknown-linux-gnu
          --package r2o-datapath --package r2k-core --package r2o-panel

  rust-workspace:
    name: Рабочее пространство Rust — формат, тесты и сборка
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - name: Запустить все тесты рабочего пространства
        run: cargo test --workspace --locked
      - name: Проверить предупреждения компилятора
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --all-targets --locked
      - name: Собрать выпускаемые программы
        run: cargo build --workspace --release --locked

  cross-check:
    name: Кросс-проверка — ${{ matrix.target }}
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-musl
            compiler_variable: CC_i686_unknown_linux_musl
            zig_target: x86-linux-musl
          - target: riscv64gc-unknown-linux-musl
            compiler_variable: CC_riscv64gc_unknown_linux_musl
            zig_target: riscv64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
        with:
          target: ${{ matrix.target }}
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_SHA256 }}
      - name: Проверить сетевые пакеты для целевой архитектуры
        env:
          TARGET: ${{ matrix.target }}
          COMPILER_VARIABLE: ${{ matrix.compiler_variable }}
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          export "$COMPILER_VARIABLE=$GITHUB_WORKSPACE/scripts/ci-zig-cross-cc.sh"
          cargo check --locked --target "$TARGET" \
            --package r2k-core --package r2o-datapath \
            --package r2o-controller --package r2o-panel

  nfqueue-integration:
    name: Интеграция NFQUEUE в сетевом пространстве
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - name: Установить средства проверки сетевых пакетов
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iproute2 nftables python3
      - name: Собрать сетевой исполнитель
        run: cargo build --release --locked --package r2o-datapath --package r2o-controller
      - name: Собрать регрессию предела raw-пакета по MTU
        run: cargo test --no-run --locked --package r2o-datapath --test raw_egress_mtu
      - name: Проверить MTU raw-посылки в отдельном сетевом пространстве
        run: sudo sh scripts/test-raw-egress-mtu-netns.sh
      - name: Проверить NFQUEUE во временном пространстве имён
        run: >-
          sudo env
          R2OD_BIN="$GITHUB_WORKSPACE/target/release/r2o-datapath"
          R2OC_BIN="$GITHUB_WORKSPACE/target/release/r2o-controller"
          sh scripts/test-nfq-netns.sh
      - name: Проверить правила nftables без применения
        run: sudo sh scripts/test-router-firewall.sh

  mipsel-release:
    name: Выпуск GNU MIPS little-endian
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/r2o-apt-archives
          key: r2o-apt-ubuntu-24.04-mipsel-cross-v1
      - name: Установить кросс-компилятор и QEMU
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r2o-apt-archives/partial"
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            -o Dir::Cache::archives="$RUNNER_TEMP/r2o-apt-archives" \
            gcc-mipsel-linux-gnu qemu-user binutils
      - name: Собрать и проверить выпуск MIPS
        run: sh scripts/build-mipsel.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # версия v7.0.2
        with:
          name: r2o-mipsel-linux-gnu
          path: |
            target/mipsel-unknown-linux-gnu/release/r2o-datapath
            target/mipsel-unknown-linux-gnu/release/r2o-controller
            target/mipsel-unknown-linux-gnu/release/r2o-telegram
            target/mipsel-unknown-linux-gnu/release/r2o-panel
            target/mipsel-unknown-linux-gnu/release/r2o-manager
            target/mipsel-unknown-linux-gnu/release/r2o-fetch
            target/mipsel-unknown-linux-gnu/release/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  openwrt-mipsel-musl:
    name: Выпуск OpenWrt MIPS little-endian musl
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/r2o/openwrt/openwrt-mipsel-musl-toolchain-25.12.5.tar.zst
          key: r2o-openwrt-sdk-Linux-mipsel-openwrt-musl-5a02d679c1ff052745b419b564624380dd3e5f6218db64c65b8ec9df56e2c263
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - name: Установить QEMU и распаковщик SDK
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user zstd binutils curl
      - name: Собрать и проверить OpenWrt MIPS под QEMU
        run: sh scripts/r2o-build-openwrt-mipsel-musl.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # версия v7.0.2
        with:
          name: r2o-openwrt-mipsel-musl
          path: |
            target/mipsel-unknown-linux-musl/release/r2o-datapath
            target/mipsel-unknown-linux-musl/release/r2o-controller
            target/mipsel-unknown-linux-musl/release/r2o-telegram
            target/mipsel-unknown-linux-musl/release/r2o-panel
            target/mipsel-unknown-linux-musl/release/r2o-manager
            target/mipsel-unknown-linux-musl/release/r2o-fetch
            target/mipsel-unknown-linux-musl/release/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  openwrt-aarch64-musl:
    name: Выпуск OpenWrt ARM64 musl
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/r2o/openwrt/openwrt-aarch64-musl-toolchain-25.12.5.tar.zst
          key: r2o-openwrt-sdk-Linux-aarch64-openwrt-musl-37875a8a69b46c9dc2a8c8bfd34a14f5de03fbea775f7cf8569f7e709c93403b
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
        with:
          target: aarch64-unknown-linux-musl
      - name: Установить QEMU и распаковщик SDK
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user zstd binutils curl
      - name: Собрать и проверить OpenWrt ARM64 под QEMU
        run: sh scripts/r2o-build-openwrt-aarch64-musl.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # версия v7.0.2
        with:
          name: r2o-openwrt-aarch64-musl
          path: |
            target/aarch64-unknown-linux-musl/release/r2o-datapath
            target/aarch64-unknown-linux-musl/release/r2o-controller
            target/aarch64-unknown-linux-musl/release/r2o-telegram
            target/aarch64-unknown-linux-musl/release/r2o-panel
            target/aarch64-unknown-linux-musl/release/r2o-manager
            target/aarch64-unknown-linux-musl/release/r2o-fetch
            target/aarch64-unknown-linux-musl/release/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  armv5-musleabi:
    name: Выпуск ARMv5 little-endian musleabi
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
        with:
          target: armv5te-unknown-linux-musleabi
      - name: Установить Clang и QEMU
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-18 qemu-user binutils
      - name: Собрать и проверить полный набор программ под QEMU
        env:
          R2O_ARMV5_LINKER: ${{ github.workspace }}/scripts/ci-armv5-clang-cc.sh
          R2O_ARMV5_AR: ar
        run: sh scripts/r2o-build-armv5-musleabi.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # версия v7.0.2
        with:
          name: r2o-armv5-linux-musleabi
          path: |
            target/armv5te-unknown-linux-musleabi/release/r2o-datapath
            target/armv5te-unknown-linux-musleabi/release/r2o-controller
            target/armv5te-unknown-linux-musleabi/release/r2o-telegram
            target/armv5te-unknown-linux-musleabi/release/r2o-panel
            target/armv5te-unknown-linux-musleabi/release/r2o-manager
            target/armv5te-unknown-linux-musleabi/release/r2o-fetch
            target/armv5te-unknown-linux-musleabi/release/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  openwrt-armv7-musl:
    name: Выпуск OpenWrt ARMv7 musl
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/r2o/openwrt/openwrt-armv7-musl-toolchain-25.12.5.tar.zst
          key: r2o-openwrt-sdk-Linux-armv7-openwrt-musl-2284afb56cbeef040372b02b721f1657ce1eee8e1c024fb1a0188374b472ae51
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
        with:
          target: armv7-unknown-linux-musleabihf
      - name: Установить QEMU и распаковщик SDK
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user zstd binutils curl
      - name: Собрать и проверить OpenWrt ARMv7 под QEMU
        run: sh scripts/r2o-build-openwrt-armv7-musl.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # версия v7.0.2
        with:
          name: r2o-openwrt-armv7-musl
          path: |
            target/armv7-unknown-linux-musleabihf/release/r2o-datapath
            target/armv7-unknown-linux-musleabihf/release/r2o-controller
            target/armv7-unknown-linux-musleabihf/release/r2o-telegram
            target/armv7-unknown-linux-musleabihf/release/r2o-panel
            target/armv7-unknown-linux-musleabihf/release/r2o-manager
            target/armv7-unknown-linux-musleabihf/release/r2o-fetch
            target/armv7-unknown-linux-musleabihf/release/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  donor-differential-plan:
    name: Проверка полноты C/Rust шардов
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - id: plan
        name: Проверить полное покрытие и построить матрицу
        run: |
          set -euo pipefail
          sh scripts/ci-differential-shards.sh verify
          printf 'matrix=%s\n' "$(sh scripts/ci-differential-shards.sh matrix)" >> "$GITHUB_OUTPUT"

  donor-differential:
    name: C/Rust differential — ${{ matrix.snapshot }} / ${{ matrix.shard }}
    needs: [lint, donor-differential-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.donor-differential-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          repository: t0fox/d2o
          ref: ${{ matrix.donor_sha }}
          path: d2o
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
        with:
          toolchain: 1.98.0
          target: aarch64-unknown-linux-gnu
      - name: Установить Clang, sysroot AArch64, QEMU и библиотеки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 qemu-user libc6-dev-arm64-cross \
            libgcc-13-dev-arm64-cross libssl-dev pkg-config zlib1g-dev binutils
      - name: Подготовить AArch64 GNU компилятор Clang
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/r2o-cross-bin"
          mkdir -p "$bin"
          ln -s "$GITHUB_WORKSPACE/scripts/ci-aarch64-linux-gnu-cc.sh" "$bin/aarch64-linux-gnu-gcc"
          ln -s "$(command -v ar)" "$bin/aarch64-linux-gnu-ar"
          ln -s "$(command -v ranlib)" "$bin/aarch64-linux-gnu-ranlib"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Проверить SHA снимка донора и подготовить C-эталон
        env:
          DONOR_SHA: ${{ matrix.donor_sha }}
        run: |
          set -euo pipefail
          test "$(git -C d2o rev-parse HEAD)" = "$DONOR_SHA"
          make -B -C d2o/datapath test_session test_quic_session test_stun_session test_routemark CC=clang-18
          cargo +1.98.0 fetch --locked
      - name: C/Rust сценарии
        env:
          DONOR_SNAPSHOT: ${{ matrix.snapshot }}
          DIFFERENTIAL_SHARD: ${{ matrix.shard }}
          R2O_EXPECTED_DONOR_SHA: ${{ matrix.donor_sha }}
          R2O_DONOR_CORE: ${{ github.workspace }}/d2o/core
          R2O_DONOR_DATAPATH: ${{ github.workspace }}/d2o/datapath
        run: |
          set -euo pipefail
          sh scripts/ci-differential-shards.sh verify
          scenario_list=$(sh scripts/ci-differential-shards.sh list "$DONOR_SNAPSHOT" "$DIFFERENTIAL_SHARD")
          if [ -z "$scenario_list" ]; then
            echo "::error::C/Rust differential shard is empty"
            exit 1
          fi
          mapfile -t scripts <<< "$scenario_list"
          failed=()
          for script in "${scripts[@]}"; do
            echo "::group::$script"
            if timeout 900s sh "scripts/$script"; then
              echo "::endgroup::"
            else
              status=$?
              failed+=("$script ($status)")
              echo "::endgroup::"
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '::error::C/Rust differential failures: %s\n' "${failed[*]}"
            exit 1
          fi
      - name: Сохранить журналы сравнения
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # версия v7.0.2
        with:
          name: r2o-differential-${{ matrix.snapshot }}-${{ matrix.shard }}
          path: .rea/*.log
          retention-days: 14
          if-no-files-found: warn

  check:
    name: check
    if: always()
    needs:
      - lint
      - panel
      - telegram
      - panel-browser
      - shell
      - datapath
      - core
      - sanitizers
      - rust-workspace
      - cross-check
      - donor-differential-plan
      - nfqueue-integration
      - mipsel-release
      - openwrt-mipsel-musl
      - openwrt-aarch64-musl
      - armv5-musleabi
      - openwrt-armv7-musl
      - donor-differential
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Завершиться ошибкой при пропуске или сбое проверки
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.lint.result == 'skipped' || needs.panel.result == 'skipped' || needs.telegram.result == 'skipped' || needs.panel-browser.result == 'skipped' || needs.shell.result == 'skipped' || needs.datapath.result == 'skipped' || needs.core.result == 'skipped' || needs.rust-workspace.result == 'skipped' || needs.cross-check.result == 'skipped' || needs.donor-differential-plan.result == 'skipped' || needs.nfqueue-integration.result == 'skipped' || needs.mipsel-release.result == 'skipped' || needs.openwrt-mipsel-musl.result == 'skipped' || needs.openwrt-aarch64-musl.result == 'skipped' || needs.armv5-musleabi.result == 'skipped' || needs.openwrt-armv7-musl.result == 'skipped' || needs.donor-differential.result == 'skipped' || (github.event_name != 'pull_request' && needs.sanitizers.result == 'skipped') }}
        run: exit 1
      - name: Все проверки завершились успешно
        run: echo "Все проверки R2O пройдены"
