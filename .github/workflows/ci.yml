name: Проверки R2O

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ZIG_VERSION: '0.16.0'
  ZIG_SHA256: '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00'

jobs:
  # Stage 1: cheap checks gate the independent full checks below.
  lint:
    name: Быстрые проверки — ShellCheck и формат Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - name: Установить ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Проверить shell-скрипты проекта
        run: |
          find scripts router -type f -name '*.sh' ! -path 'scripts/test-router-openwrt-init.sh' -print0 | xargs -0 -r shellcheck -S warning -s sh
          shellcheck -S warning -s bash scripts/test-router-openwrt-init.sh
          shellcheck -S warning -s sh router/S99r2o router/S99r2o.shim router/openwrt-init
      - name: Проверить передачу артефактов из CI в Release
        run: python3 -B scripts/test-ci-release-artifacts.py
      - name: Проверить формирование заметок выпуска
        run: python3 -B scripts/test-release-changelog.py
      - name: Проверить закреплённые суммы установщика
        run: python3 -B scripts/bootstrap-pins.py
      - name: Проверить форматирование Rust
        run: cargo fmt --all --check

  panel-browser:
    name: Chrome — раскладка и работа панели
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R2O_CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # версия v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # версия v2
        id: chrome
        with:
          chrome-version: stable
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - name: Собрать панель
        run: cargo build --locked --package r2o-panel
      - name: Проверить представление Telegram в статистике панели
        run: node crates/r2o-panel/tests/telegram_flow.cjs
      - name: Проверить Chrome, раскладку, навигацию и шрифты
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          R2O_CAPTURE_DIR: ${{ runner.temp }}/panel-browser
        run: |
          mkdir -p "$R2O_CAPTURE_DIR"
          node crates/r2o-panel/tests/browser.cjs
      - name: Сохранить снимки панели и журнал браузера
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # версия v7.0.2
        with:
          name: r2o-panel-chrome
          path: ${{ runner.temp }}/panel-browser
          retention-days: 7
          if-no-files-found: warn

  shell:
    name: Сценарии и проверки установки
    needs: lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - name: Установить зависимости production TLS fixture
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libssl-dev pkg-config zlib1g-dev nftables iproute2
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - name: Собрать бинарники для сценариев роутера
        run: cargo build --locked --release --package r2o-datapath --bin r2o-datapath --package r2o-manager --bin r2o-manager --package r2o-controller --bin r2o-controller --package r2o-telegram --bin r2o-telegram
      - name: Собрать LAN-проверку HTTP/3
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          set -euo pipefail
          cargo test --locked -p r2o-controller --test r2o_quic_http3 --no-run --message-format=json |
            python3 -c '
          import json, sys
          artifacts = (json.loads(line) for line in sys.stdin)
          [path] = [msg["executable"] for msg in artifacts
                    if msg["reason"] == "compiler-artifact"
                    and msg["target"]["name"] == "r2o_quic_http3" and msg.get("executable")]
          print(f"R2O_HTTP3_LAN_BIN={path}")
          ' >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # версия v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Проверить упаковку выпуска
        run: |
          sh scripts/test-package-release.sh
          python3 -B scripts/test-update-catalog.py
          python3 -B scripts/test-release-retention.py
      - name: Проверить сценарии обновления и службы роутера
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is not set}"
          export R2O_DATAPATH_BIN="$GITHUB_WORKSPACE/target/release/r2o-datapath"
          shopt -s nullglob
          tests=("$GITHUB_WORKSPACE"/scripts/test-router-*.sh)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::Не найдены сценарии проверки роутерных служб в $GITHUB_WORKSPACE/scripts"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name 'test-router-*.sh' -print
            exit 1
          fi
          failed=()
          skipped=0
          for test in "${tests[@]}"; do
            test_name=${test##*/}
            # Дифференциальные сценарии требуют внешнего чекаута D2O. Они
            # остаются в репозитории, но CI от донора не зависит: без
            # R2O_DONOR_ROOT такие файлы пропускаются.
            if grep -qE 'R2O_DONOR_ROOT|D2O_DONOR|/d2o|d2o-current|d2o-a378' "$test"; then
              skipped=$((skipped + 1))
              continue
            fi
            echo "::group::$test"
            test_shell='sh'
            if [ "$test_name" = test-router-openwrt-init.sh ]; then
              test_shell='bash'
            fi
            status=0
            case "$test_name" in
              test-router-flowtable-netns.sh)
                sudo --preserve-env=R2O_HTTP3_LAN_BIN sh "$test" || status=$? ;;
              test-router-firewall.sh|test-router-dns-route-netns.sh)
                sudo sh "$test" || status=$? ;;
              *) "$test_shell" "$test" || status=$? ;;
            esac
            if [ "$status" -ne 0 ]; then
              failed+=("$test ($status)")
            fi
            echo "::endgroup::"
          done
          echo "Пропущено из-за отсутствия донора D2O: $skipped"
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '::error::Ошибки сценариев роутера: %s\n' "${failed[*]}"
            exit 1
          fi

      - name: Проверить подбор TLS с LAN-клиента
        run: |
          sudo bash scripts/test-geneva-midpoint-netns.sh \
            "$GITHUB_WORKSPACE/target/release/r2o-datapath" \
            "$GITHUB_WORKSPACE/target/release/r2o-controller" --lan-discovery

  sanitizers:
    name: Датапат, ядро и панель под AddressSanitizer
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
        with:
          toolchain: nightly-2026-10-17
          components: rust-src
      - name: Запустить тесты с AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: >-
          cargo +nightly-2026-10-17 test -Zbuild-std --locked
          --target x86_64-unknown-linux-gnu
          --package r2o-datapath --package r2k-core --package r2o-panel

  rust-workspace:
    name: Рабочее пространство Rust — формат, тесты и сборка
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - name: Запустить все тесты рабочего пространства
        run: cargo test --workspace --locked
      - name: Проверить предупреждения компилятора
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --all-targets --locked
      - name: Собрать выпускаемые программы
        run: cargo build --workspace --release --locked
      - name: Проверить расширенную диагностику
        run: |
          cargo test --locked -p r2k-core --features memory-diagnostics allocator::
          cargo check --locked --workspace --features r2k-core/memory-diagnostics
      - name: Проверить обновление при перезапуске панели
        run: python3 -B scripts/test-router-update-panel-restart.py target/release/r2o-manager target/release/r2o-panel

  cross-check:
    name: Кросс-проверка — ${{ matrix.target }}
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-musl
            compiler_variable: CC_i686_unknown_linux_musl
            zig_target: x86-linux-musl
          - target: riscv64gc-unknown-linux-musl
            compiler_variable: CC_riscv64gc_unknown_linux_musl
            zig_target: riscv64-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
        with:
          target: ${{ matrix.target }}
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_SHA256 }}
      - name: Проверить сетевые пакеты для целевой архитектуры
        env:
          TARGET: ${{ matrix.target }}
          COMPILER_VARIABLE: ${{ matrix.compiler_variable }}
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          export "$COMPILER_VARIABLE=$GITHUB_WORKSPACE/scripts/ci-zig-cross-cc.sh"
          cargo check --locked --target "$TARGET" \
            --package r2k-core --package r2o-datapath \
            --package r2o-controller --package r2o-panel

  nfqueue-integration:
    name: Интеграция NFQUEUE в сетевом пространстве
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
      - name: Установить средства проверки сетевых пакетов
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential iproute2 nftables python3
      - name: Собрать сетевой исполнитель
        run: cargo build --release --locked --package r2o-datapath --package r2o-controller
      - name: Собрать регрессию предела raw-пакета по MTU
        run: cargo test --no-run --locked --package r2o-datapath --test raw_egress_mtu
      - name: Проверить MTU raw-посылки в отдельном сетевом пространстве
        run: sudo sh scripts/test-raw-egress-mtu-netns.sh
      # Полная namespace-матрица test-nfq-netns.sh остаётся локальной:
      # в CI обязательны focused NFQUEUE/smoke-проверки ниже.
      - name: Run live Discord Discovery NFQUEUE smoke
        run: >-
          sudo env
          R2OD_BIN="$GITHUB_WORKSPACE/target/release/r2o-datapath"
          R2OC_BIN="$GITHUB_WORKSPACE/target/release/r2o-controller"
          sh scripts/test-discord-discovery-nfq.sh
      - name: Проверить правила nftables без применения
        run: sudo sh scripts/test-router-firewall.sh

  release-build:
    name: Выпуск ABI — ${{ matrix.abi }}
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - abi: mipsel
            target: mipsel-unknown-linux-musl
            script: scripts/r2o-build-static-musl.sh
            packages: binutils zstd curl
            apt_cache_key: ''
            sdk_archive: ''
            sdk_sha256: ''
            rust_target: ''
          - abi: mipsel-openwrt-musl
            target: mipsel-unknown-linux-musl
            script: scripts/r2o-build-openwrt-mipsel-musl.sh
            packages: zstd binutils curl
            apt_cache_key: ''
            sdk_archive: openwrt-mipsel-musl-toolchain-25.12.5.tar.zst
            sdk_sha256: 5a02d679c1ff052745b419b564624380dd3e5f6218db64c65b8ec9df56e2c263
            rust_target: ''
          - abi: aarch64-openwrt-musl
            target: aarch64-unknown-linux-musl
            script: scripts/r2o-build-openwrt-aarch64-musl.sh
            packages: zstd binutils curl
            apt_cache_key: ''
            sdk_archive: openwrt-aarch64-musl-toolchain-25.12.5.tar.zst
            sdk_sha256: 37875a8a69b46c9dc2a8c8bfd34a14f5de03fbea775f7cf8569f7e709c93403b
            rust_target: aarch64-unknown-linux-musl
          - abi: armv5-musleabi
            target: armv5te-unknown-linux-musleabi
            script: scripts/r2o-build-armv5-musleabi.sh
            packages: clang-18 binutils zstd curl
            apt_cache_key: ''
            sdk_archive: ''
            sdk_sha256: ''
            rust_target: armv5te-unknown-linux-musleabi
          - abi: armv7-openwrt-musl
            target: armv7-unknown-linux-musleabihf
            script: scripts/r2o-build-openwrt-armv7-musl.sh
            packages: zstd binutils curl
            apt_cache_key: ''
            sdk_archive: openwrt-armv7-musl-toolchain-25.12.5.tar.zst
            sdk_sha256: 2284afb56cbeef040372b02b721f1657ce1eee8e1c024fb1a0188374b472ae51
            rust_target: armv7-unknown-linux-musleabihf
          - abi: armv7-musleabi
            target: armv7-unknown-linux-musleabi
            script: scripts/r2o-build-static-musl.sh
            packages: binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
            apt_cache_key: ''
            rust_target: ''
          - abi: mips-openwrt-musl
            target: mips-unknown-linux-musl
            script: scripts/r2o-build-static-musl.sh
            packages: binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
            apt_cache_key: ''
            rust_target: ''
          - abi: mips64el-musl
            target: mips64el-unknown-linux-muslabi64
            script: scripts/r2o-build-static-musl.sh
            packages: binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
            apt_cache_key: ''
            rust_target: ''
          - abi: x86_64-musl
            target: x86_64-unknown-linux-musl
            script: scripts/r2o-build-static-musl.sh
            packages: binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
            apt_cache_key: ''
            rust_target: ''
          - abi: i686-musl
            target: i686-unknown-linux-musl
            script: scripts/r2o-build-static-musl.sh
            packages: binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
            apt_cache_key: ''
            rust_target: ''
          - abi: powerpc64-musl
            target: powerpc64-unknown-linux-musl
            script: scripts/r2o-build-static-musl.sh
            packages: binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
            apt_cache_key: ''
            rust_target: ''
          - abi: riscv64-musl
            target: riscv64gc-unknown-linux-musl
            script: scripts/r2o-build-static-musl.sh
            packages: binutils zstd curl
            sdk_archive: ''
            sdk_sha256: ''
            apt_cache_key: ''
            rust_target: ''
    env:
      CARGO_BUILD_WARNINGS: deny
      ABI: ${{ matrix.abi }}
      TARGET: ${{ matrix.target }}
      BUILD_SCRIPT: ${{ matrix.script }}
      PACKAGES: ${{ matrix.packages }}
      APT_CACHE_KEY: ${{ matrix.apt_cache_key }}
      R2O_ARMV5_LINKER: ${{ github.workspace }}/scripts/ci-armv5-clang-cc.sh
      R2O_ARMV5_AR: ar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # версия v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # версия v6.1.0
        if: ${{ matrix.apt_cache_key != '' }}
        with:
          path: ${{ runner.temp }}/r2o-apt-archives
          key: ${{ matrix.apt_cache_key }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # версия v6.1.0
        if: ${{ matrix.sdk_sha256 != '' }}
        with:
          path: ~/.cache/r2o/openwrt/${{ matrix.sdk_archive }}
          key: r2o-openwrt-sdk-Linux-${{ matrix.abi }}-${{ matrix.sdk_sha256 }}
      - name: Установить системные инструменты ABI
        run: |
          set -euo pipefail
          read -r -a packages <<< "$PACKAGES"
          if [ -n "$APT_CACHE_KEY" ]; then
            sh scripts/ci-apt-cache.sh prepare "$RUNNER_TEMP/r2o-apt-archives" /tmp/r2o-apt-archives-partial
            sudo apt-get update -qq
            sudo apt-get install -y -qq \
              -o Dir::Cache::archives="$RUNNER_TEMP/r2o-apt-archives" \
              -o Dir::Cache::archives::partial=/tmp/r2o-apt-archives-partial \
              "${packages[@]}"
            sh scripts/ci-apt-cache.sh finalize "$RUNNER_TEMP/r2o-apt-archives"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq "${packages[@]}"
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
        if: ${{ matrix.rust_target == '' }}
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # версия v2.0.0
        if: ${{ matrix.rust_target != '' }}
        with:
          target: ${{ matrix.rust_target }}
      - uses: ./.github/actions/setup-zig
        if: matrix.script == 'scripts/r2o-build-static-musl.sh'
        with:
          version: ${{ matrix.abi == 'mipsel' && '0.15.2' || matrix.abi == 'mips64el-musl' && '0.14.1' || '0.16.0' }}
          sha256: ${{ matrix.abi == 'mipsel' && '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239' || matrix.abi == 'mips64el-musl' && '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c' || '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00' }}
      - name: Установить QEMU
        run: |
          sh scripts/ci-install-release-qemu.sh "$RUNNER_TEMP/qemu"
          echo "$RUNNER_TEMP/qemu/bin" >> "$GITHUB_PATH"
      - name: Проверить mallocng на страницах 4 КиБ
        if: matrix.abi == 'mipsel'
        run: sh scripts/qemu-platform/check-allocator-pages.sh 4096
      - name: Проверить mallocng на страницах 16 КиБ в QEMU
        if: matrix.abi == 'mipsel'
        run: |
          sudo apt-get install -y -qq qemu-system-arm cpio
          sh scripts/qemu-platform/check-allocator-pages.sh 16384
      - name: Собрать ABI и проверить ELF-артефакты
        run: |
          identity=$(python3 scripts/ci-release-artifacts.py identity "$GITHUB_SHA" "$GITHUB_RUN_ID")
          R2O_RELEASE_ID=$(sed -n 's/^release_id=//p' <<< "$identity")
          R2O_RELEASE_TITLE=$(sed -n 's/^title=//p' <<< "$identity")
          R2O_BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export R2O_RELEASE_ID R2O_RELEASE_TITLE R2O_BUILT R2O_COMMIT="$GITHUB_SHA"
          if [ "$ABI" = mipsel ]; then
            build_dir=$(mktemp -d "$RUNNER_TEMP/r2o-mipsel.XXXXXX")
            CARGO_TARGET_DIR="$build_dir" CARGO_PROFILE_RELEASE_STRIP=none \
              R2O_MIPSEL_VERIFY_ALLOCATOR=1 sh "$BUILD_SCRIPT"
            sh scripts/check-mipsel-allocator.sh "$build_dir/$TARGET/release"
            sudo apt-get install -y -qq binutils-mipsel-linux-gnu
            mkdir -p "target/$TARGET/release"
            for binary in r2o-{controller,datapath,panel,telegram,manager,fetch,detect}; do
              mipsel-linux-gnu-strip --strip-all -o "target/$TARGET/release/$binary" "$build_dir/$TARGET/release/$binary"
            done
          else
            sh "$BUILD_SCRIPT"
          fi
          sh scripts/check-release-abi.sh "$ABI" "target/$TARGET/release"
          python3 scripts/ci-release-artifacts.py record "target/$TARGET/release" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$ABI" "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # версия v7.0.2
        with:
          name: r2o-bin-${{ github.sha }}-${{ matrix.abi }}-a${{ github.run_attempt }}
          path: |
            target/${{ matrix.target }}/release/r2o-datapath
            target/${{ matrix.target }}/release/r2o-controller
            target/${{ matrix.target }}/release/r2o-panel
            target/${{ matrix.target }}/release/r2o-telegram
            target/${{ matrix.target }}/release/r2o-manager
            target/${{ matrix.target }}/release/r2o-fetch
            target/${{ matrix.target }}/release/r2o-detect
            target/${{ matrix.target }}/release/build-info.json
            target/${{ matrix.target }}/release/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  check:
    name: check
    if: always()
    needs:
      - lint
      - panel-browser
      - shell
      - sanitizers
      - rust-workspace
      - cross-check
      - nfqueue-integration
      - release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Завершиться ошибкой при пропуске или сбое проверки
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.lint.result == 'skipped' || needs.panel-browser.result == 'skipped' || needs.shell.result == 'skipped' || needs.rust-workspace.result == 'skipped' || needs.cross-check.result == 'skipped' || needs.nfqueue-integration.result == 'skipped' || needs.release-build.result == 'skipped' || (github.event_name != 'pull_request' && needs.sanitizers.result == 'skipped') }}
        run: exit 1
      - name: Все проверки завершились успешно
        run: echo "Все проверки R2O пройдены"
