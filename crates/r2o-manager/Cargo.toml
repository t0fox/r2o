[package]
name = "r2o-manager"
version = "0.1.0"
edition = "2024"
description = "Signed release verification and lifecycle manager for r2o"

[dependencies]
base64 = "0.22"
flate2 = "1.1"
ring = "0.17"
r2k-core = { path = "../r2k-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
name = "r2o_manager"

[[bin]]
name = "r2o-manager"
path = "src/main.rs"
