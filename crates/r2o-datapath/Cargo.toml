[package]
name = "r2o-datapath"
version = "0.1.0"
edition = "2024"
description = "Linux NFQUEUE datapath daemon"

[dependencies]
r2k-core = { package = "r2k-core", path = "../r2k-core" }
libc = "0.2.189"

[dev-dependencies]
etherparse = "0.21.0"
proptest = "1.12.0"

[lib]
name = "r2o_datapath"

[[bin]]
name = "r2o-datapath"
path = "src/main.rs"
